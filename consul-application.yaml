apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: consul
  namespace: argocd
spec:
  # Automatically synchronize changes from sources, create Consul namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

  project: consul

  sources:
    # Deploy Consul Helm chart
    - chart: consul
      repoURL: https://helm.releases.hashicorp.com
      targetRevision: 1.2.2
      helm:
        releaseName: consul
        valueFiles:
          - $values/consul-helm-values.yaml

    # Use values from demo repository for Helm chart
    - repoURL: 'https://github.com/Red-I3ull/consul.git'
      targetRevision: BULL-44-Create-consul-repo-and-add-application-for-argo-cd-and-deploy-consul
      ref: values

    # Use Consul CRDs to configure proxy-defaults and mesh
    - repoURL: 'https://github.com/Red-I3ull/consul.git'
      path: consul-config
      targetRevision: BULL-44-Create-consul-repo-and-add-application-for-argo-cd-and-deploy-consul

  # Deploy to the consul namespace in same cluster
  destination:
    server: "https://kubernetes.default.svc"
    namespace: consul
